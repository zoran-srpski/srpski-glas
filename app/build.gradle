plugins { id 'com.android.application' }

android {
    namespace 'rs.srpskiglas'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile rootProject.file('test-signing.jks')
            storePassword 'srpskiglas-test'
            keyAlias 'srpskiglas-test'
            keyPassword 'srpskiglas-test'
        }
    }

    defaultConfig {
        applicationId 'rs.srpskiglas'
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName '0.7.2'
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    sourceSets {
        main.java.srcDirs += '../src/main/java'
    }
}
