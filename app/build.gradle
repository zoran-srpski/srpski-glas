plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'rs.srpskiglas'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile rootProject.file('test-signing.jks')
            storePassword 'srpskiglas-test'
            keyAlias 'srpskiglas-test'
            keyPassword 'srpskiglas-test'
        }
    }

    defaultConfig {
        applicationId 'rs.srpskiglas'
        minSdk 26
        targetSdk 35
        versionCode 97
        versionName '0.10.41-whisper-test'
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += '../src/main/java'
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.4.aar')
}
