name: Build Silent Dictation Test APK

on:
  push:
    branches:
      - 'test/silent-dictation'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable on-device speech recognizer
        run: python3 tools/enable_silent_dictation_test.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: srpski-glas-silent-dictation-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
