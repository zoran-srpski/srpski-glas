name: Build Start Beep Only Test APK

on:
  push:
    branches: [ test/start-beep-only ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply start-beep-only dictation patch
        run: |
          python3 tools/enable_start_beep_only_test.py
          python3 tools/stop_after_google_result_test.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: srpski-glas-one-session-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
